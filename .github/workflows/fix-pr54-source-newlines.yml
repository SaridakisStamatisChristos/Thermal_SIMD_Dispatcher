name: Fix PR 54 source newlines

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'deep-audit-fixes-v0.4.2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Normalize source EOF newlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          suffixes = {'.c', '.h', '.cc', '.hh', '.cpp', '.hpp', '.cxx', '.hxx'}
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          changed = []
          for name in tracked:
              p = Path(name)
              if p.suffix.lower() not in suffixes or not p.is_file():
                  continue
              data = p.read_bytes()
              if data and not data.endswith(b'\n'):
                  p.write_bytes(data + b'\n')
                  changed.append(name)
          print('normalized:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit newline normalization
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Normalize source EOF newlines for strict Clang gate"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
