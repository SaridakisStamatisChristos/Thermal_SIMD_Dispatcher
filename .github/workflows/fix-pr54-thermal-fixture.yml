name: Fix PR 54 thermal fixture

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'deep-audit-fixes-v0.4.2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Give monitor fixture an explicit thermal freshness window
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_thermal_simd.c')
          text = p.read_text(encoding='utf-8')
          old = '''    tsd_test_set_policy_counts(1, 1);\n    tsd_test_set_timing(1000, 1, 1, 1);\n'''
          new = '''    tsd_test_set_policy_counts(1, 1);\n    tsd_test_set_timing(1000, 1, 1, 1);\n    /* This scenario intentionally publishes one cool authorization sample.\n     * Keep it fresh for the duration of the deterministic monitor sequence;\n     * production freshness remains unchanged. */\n    g_tsd_config.telemetry_max_skew_ms = 5000;\n'''
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('monitor fixture setup not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fixture stabilization
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_thermal_simd.c
          git commit -m "Stabilize monitor thermal freshness fixture"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
