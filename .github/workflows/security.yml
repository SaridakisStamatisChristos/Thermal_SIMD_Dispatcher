name: Security Regression

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  trampoline-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libssl-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON

      - name: Build security targets
        run: cmake --build build --target test_trampoline_security test_healthcheck_runtime_flags test_thermal_simd

      - name: Verify immutable RX trampolines
        run: ctest --test-dir build --output-on-failure -R 'trampoline_security|healthcheck_runtime_flags|thermal_simd'
