name: Apply Final Hardening

on:
  push:
    branches: [ fix/final-safety-liveness-hardening ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transform-and-validate:
    if: github.event_name != 'push' || github.event.head_commit.message != 'Complete final safety and liveness hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/final-safety-liveness-hardening
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build libssl-dev

      - name: Apply exact source transformations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ci/_apply_final_hardening.py')
          s = p.read_text(encoding='utf-8')
          old = 'out, count = re.subn(pattern, repl, text, count=1, flags=re.S)'
          new = 'out, count = re.subn(pattern, lambda _match: repl, text, count=1, flags=re.S)'
          if old not in s:
              raise SystemExit('regex helper pattern not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 ci/_apply_final_hardening.py
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/thermal_simd.c')
          s = p.read_text(encoding='utf-8')
          old = 'static int32_t simd_shim_unlocked(int32_t a, int32_t b);'
          new = ('static int32_t simd_shim_unlocked(int32_t a, int32_t b, '
                 'tsd_patch_slot_t *target, simd_width_t selected);')
          if old not in s:
              raise SystemExit('shim prototype pattern not found')
          s = s.replace(old, new, 1)
          repairs = {
              'tsd_runtime_config_effective_down_count(&g_tsd_config) = down;': 'g_tsd_config.down_count = down;',
              'tsd_runtime_config_effective_up_count(&g_tsd_config) = up;': 'g_tsd_config.up_count = up;',
              'tsd_runtime_config_effective_cooldown_down_ms(&g_tsd_config) = cooldown_down_ms;': 'g_tsd_config.cooldown_down_ms = cooldown_down_ms;',
              'tsd_runtime_config_effective_cooldown_up_ms(&g_tsd_config) = cooldown_up_ms;': 'g_tsd_config.cooldown_up_ms = cooldown_up_ms;',
              'tsd_runtime_config_effective_min_dwell_ms(&g_tsd_config) = dwell_ms;': 'g_tsd_config.min_dwell_ms = dwell_ms;',
          }
          for before, after in repairs.items():
              if before not in s:
                  raise SystemExit(f'test setter repair not found: {before}')
              s = s.replace(before, after, 1)
          old = '''        if (policy_state) {\n            tsd_dispatcher_policy_record(policy_state, &eval, width);\n        }'''
          new = '''        if (policy_state && eval.performance_available) {\n            tsd_dispatcher_policy_record(policy_state, &eval, width);\n        }'''
          if old not in s:
              raise SystemExit('policy record gate not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/thermal_perf.c')
          s = p.read_text(encoding='utf-8')
          old = 'process_measurement(ctx, out, current_cpi, 0, cfg, &telemetry)'
          new = 'process_measurement(ctx, out, current_cpi, 0, 0, cfg, &telemetry)'
          if old not in s:
              raise SystemExit('perf test helper call not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('src/healthcheck/sandbox.cpp')
          s = p.read_text(encoding='utf-8')
          if '#include <new>' not in s:
              s = s.replace('#include <exception>\n', '#include <exception>\n#include <new>\n', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('tests/dispatch/test_adaptive_dispatch.c')
          s = p.read_text(encoding='utf-8')
          if '#include <config/runtime_flags.h>' not in s:
              s = s.replace('#include <thermal/simd/adaptive_dispatch.h>\n',
                            '#include <config/runtime_flags.h>\n#include <thermal/simd/adaptive_dispatch.h>\n', 1)
          marker = 'int main(void) {\n'
          init = ('int main(void) {\n'
                  '    tsd_runtime_flags_init();\n'
                  '    tsd_runtime_flags_record_sandbox_success();\n')
          if marker not in s:
              raise SystemExit('adaptive main marker not found')
          s = s.replace(marker, init, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Configure GCC Debug
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DTSD_BUILD_BENCHMARKS=ON

      - name: Build all
        run: cmake --build build -j2

      - name: Run full test suite
        run: ctest --test-dir build --output-on-failure

      - name: Validate legacy build
        run: make -j2

      - name: Prepare source-only commit
        run: |
          rm -f ci/_apply_final_hardening.py
          git checkout -- .github/workflows/quality.yml

      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No transformed changes to commit"
            exit 0
          fi
          git commit -m "Complete final safety and liveness hardening"
          git push origin HEAD:fix/final-safety-liveness-hardening
