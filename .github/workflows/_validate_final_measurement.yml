name: Validate Final Measurement Hardening

on:
  push:
    branches: [ fix/final-safety-liveness-hardening ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event_name != 'push' || github.event.head_commit.message != 'Finalize measurement evidence semantics'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/final-safety-liveness-hardening
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build libssl-dev

      - name: Apply measurement fix
        run: python3 ci/_fix_measurement_evidence.py

      - name: Configure GCC Debug
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DTSD_BUILD_BENCHMARKS=ON

      - name: Build all
        run: cmake --build build -j2

      - name: Run full test suite
        run: ctest --test-dir build --output-on-failure

      - name: Validate legacy build
        run: make -j2

      - name: Prepare source-only commit
        run: rm -f ci/_fix_measurement_evidence.py

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Finalize measurement evidence semantics"
          git push origin HEAD:fix/final-safety-liveness-hardening
