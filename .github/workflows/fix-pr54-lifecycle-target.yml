name: Fix PR 54 lifecycle target

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'deep-audit-fixes-v0.4.2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Isolate lifecycle fault-injection test from production archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CMakeLists.txt')
          text = p.read_text(encoding='utf-8')
          old = '''    add_executable(test_runtime_lifecycle tests/runtime/test_runtime_lifecycle.c)\n    target_link_libraries(test_runtime_lifecycle PRIVATE thermal_simd_core Threads::Threads)\n    target_compile_options(test_runtime_lifecycle PRIVATE -Wall -Wextra -pthread)\n    target_include_directories(test_runtime_lifecycle PRIVATE ${CMAKE_CURRENT_SOURCE_DIR}/src)\n    add_test(NAME runtime_lifecycle COMMAND test_runtime_lifecycle)\n'''
          new = '''    # Lifecycle fault-injection hooks live only in the white-box build. Compile\n    # the public wrapper plus private runtime implementation into this test so\n    # production thermal_simd_core remains free of test-only symbols.\n    add_executable(test_runtime_lifecycle\n        tests/runtime/test_runtime_lifecycle.c\n        src/runtime_api.c\n        src/thermal_simd.c)\n    target_link_libraries(test_runtime_lifecycle PRIVATE thermal_simd_core_tests Threads::Threads m ${TSD_CXX_RUNTIME_LIBRARIES})\n    target_compile_definitions(test_runtime_lifecycle PRIVATE TSD_ENABLE_TESTS)\n    target_compile_options(test_runtime_lifecycle PRIVATE -Wall -Wextra -pthread -fPIC -mno-avx ${THERMAL_SIMD_DISPATCHER_CPU_FLAGS})\n    target_include_directories(test_runtime_lifecycle PRIVATE ${CMAKE_CURRENT_SOURCE_DIR}/src)\n    set_target_properties(test_runtime_lifecycle PROPERTIES LINKER_LANGUAGE CXX)\n    add_test(NAME runtime_lifecycle COMMAND test_runtime_lifecycle)\n'''
          if new in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit(f'unexpected lifecycle target layout: {text.count(old)} matches')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit target repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "Test shutdown fault paths without leaking test hooks"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
