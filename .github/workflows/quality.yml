name: Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-matrix:
    name: ${{ matrix.compiler }} / Debug
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build libssl-dev

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DTSD_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build -j2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Clang ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libssl-dev

      - name: Configure sanitizers
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitize -j2

      - name: Run sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure -E "stress_signal_storm_smoke"

  thread-sanitizer:
    name: Clang TSan / concurrency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libssl-dev

      - name: Configure ThreadSanitizer
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build focused concurrency targets
        run: |
          cmake --build build-tsan --target \
            test_telemetry_fusion \
            test_telemetry_fusion_stress \
            test_observability_metrics \
            test_adaptive_dispatch \
            test_runtime_lifecycle -j2

      - name: Run focused TSan suite
        env:
          TSAN_OPTIONS: halt_on_error=1:history_size=7
        run: |
          ctest --test-dir build-tsan --output-on-failure \
            -R "^(telemetry_fusion_thread|telemetry_fusion_stress|observability_metrics|adaptive_dispatch|runtime_lifecycle)$"

  packaging:
    name: Make + install + consumer + container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake ninja-build libssl-dev

      - name: Build legacy Makefile path
        run: make -j2

      - name: Configure install tree
        run: cmake -S . -B build-install -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build install tree
        run: cmake --build build-install -j2

      - name: Install to staging prefix
        run: cmake --install build-install --prefix "$PWD/stage"

      - name: Validate staged artifacts
        run: |
          test -x stage/bin/thermal_simd
          test -f stage/etc/thermal-simd/controller_coeffs.json
          test -f stage/include/thermal/simd/thermal_trampoline.h
          test -f stage/include/thermal/simd/adaptive_dispatch.h
          test -f stage/include/thermal/simd/runtime.h
          test -f stage/lib/cmake/thermal_simd_dispatcher/thermal_simd_dispatcherConfig.cmake
          test -f stage/share/doc/thermal_simd_dispatcher/LICENSE
          test -f stage/share/doc/thermal_simd_dispatcher/NOTICE
          test -f stage/share/doc/thermal_simd_dispatcher/THIRD_PARTY_NOTICES.md

      - name: Build external installed-package consumer
        run: |
          cmake -S tests/consumer -B build-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer -j2
          ./build-consumer/thermal_simd_consumer

      - name: Build container image
        run: |
          docker build -f packaging/Dockerfile -t thermal-simd:ci .
          docker run --rm --entrypoint test thermal-simd:ci \
            -f /usr/share/doc/thermal-simd-dispatcher/LICENSE
          docker run --rm --entrypoint test thermal-simd:ci \
            -f /usr/share/doc/thermal-simd-dispatcher/NOTICE
          docker run --rm --entrypoint test thermal-simd:ci \
            -f /usr/share/doc/thermal-simd-dispatcher/THIRD_PARTY_NOTICES.md

  software-benchmark-smoke:
    name: Software benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libssl-dev

      - name: Configure and build benchmark
        run: |
          cmake -S . -B build-bench -G Ninja -DCMAKE_BUILD_TYPE=Release -DTSD_BUILD_BENCHMARKS=ON
          cmake --build build-bench --target benchmark_dispatch benchmark_registered_kernel -j2

      - name: Validate benchmark execution
        run: |
          bash -n ci/*.sh tests/hil/*.sh
          python3 - <<'PY'
          from pathlib import Path

          for path in sorted(Path("ci").glob("*.py")):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
          ./build-bench/benchmark_dispatch 100000
          ./build-bench/benchmark_registered_kernel \
            --mode=sse41 \
            --duration-seconds=0.05 \
            --work-items=4096 \
            --chunk-items=1024 \
            --rounds=2 \
            --result-json=registered-kernel-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("registered-kernel-smoke.json").read_text(encoding="utf-8"))
          assert result["mode"] == "sse41"
          assert result["completed_passes"] > 0
          assert result["completed_work_items"] > 0
          assert result["checksum_fnv1a64"]
          PY
          python3 ci/controlled_benchmark.py \
            --executable ./build-bench/benchmark_registered_kernel \
            --target-isa sse41 \
            --trials 2 \
            --duration-seconds 0.05 \
            --warmup-seconds 0 \
            --cooldown-seconds 0 \
            --sample-interval-seconds 0.05 \
            --work-items 4096 \
            --chunk-items 1024 \
            --rounds 2 \
            --output-json controlled-smoke.json \
            --output-csv controlled-smoke.csv \
            --log-dir controlled-smoke-trials
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("controlled-smoke.json").read_text(encoding="utf-8"))
          assert summary["target_isa"] == "sse41"
          assert summary["modes"]["sse41"]["trial_count"] == 2
          assert len(summary["trials"]) == 2
          PY
