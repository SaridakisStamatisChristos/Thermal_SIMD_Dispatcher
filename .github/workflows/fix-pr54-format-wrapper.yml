name: Fix PR 54 formatter wrapper

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'deep-audit-fixes-v0.4.2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Scope nonliteral-format suppression to audited forwarding helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/thermal_simd.c')
          text = p.read_text(encoding='utf-8')
          old = '''static void append_message(char *buf, size_t buf_size, size_t *cursor, const char *fmt, ...) {\n'''
          new = '''/* append_message is an internal printf-style forwarding helper. Call sites use\n * literal formats; the helper necessarily forwards its format parameter to\n * vsnprintf. Keep global -Werror and suppress only Clang's nonliteral warning\n * around this audited forwarding boundary. */\n#if defined(__clang__)\n#pragma clang diagnostic push\n#pragma clang diagnostic ignored "-Wformat-nonliteral"\n#endif\nstatic void append_message(char *buf, size_t buf_size, size_t *cursor, const char *fmt, ...) {\n'''
          if text.count(old) != 1:
              raise SystemExit(f'append_message declaration mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)
          marker = '''    } else {\n        *cursor += (size_t)written;\n    }\n}\n\nstatic int evaluate_thermal'''
          replacement = '''    } else {\n        *cursor += (size_t)written;\n    }\n}\n#if defined(__clang__)\n#pragma clang diagnostic pop\n#endif\n\nstatic int evaluate_thermal'''
          if text.count(marker) != 1:
              raise SystemExit(f'append_message end mismatch: {text.count(marker)}')
          p.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - name: Commit formatter repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/thermal_simd.c
          git commit -m "Audit internal formatter under strict Clang warnings"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
