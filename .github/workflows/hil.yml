name: Hardware-in-the-Loop

on:
  workflow_dispatch:
    inputs:
      target_isa:
        description: Widest SIMD ISA to exercise
        required: true
        type: choice
        default: avx2
        options:
          - avx2
          - avx512
      soak_minutes:
        description: Thermal characterization duration in minutes
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  hardware-smoke:
    runs-on:
      - self-hosted
      - linux
      - x64
      - hil
      - ${{ inputs.target_isa }}
    timeout-minutes: 30
    env:
      HIL_TARGET_ISA: ${{ inputs.target_isa }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Hardware smoke
        run: ci/hw-smoke.sh

  stress-suite:
    needs: hardware-smoke
    runs-on:
      - self-hosted
      - linux
      - x64
      - hil
      - ${{ inputs.target_isa }}
    timeout-minutes: 60
    env:
      HIL_TARGET_ISA: ${{ inputs.target_isa }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build stress targets
        run: cmake --build build-ci --target stress_patch_request stress_signal_storm stress_telemetry_faults -j"$(nproc)"
      - name: Patch-selection stress
        run: build-ci/stress_patch_request --threads=8 --iterations=4000
      - name: Signal stress
        run: build-ci/stress_signal_storm --duration-seconds=45 --signal-rate=350
      - name: Telemetry fault stress
        run: build-ci/stress_telemetry_faults --cycles=5

  thermal-characterization:
    needs: stress-suite
    runs-on:
      - self-hosted
      - linux
      - x64
      - hil
      - ${{ inputs.target_isa }}
    timeout-minutes: 360
    env:
      HIL_TARGET_ISA: ${{ inputs.target_isa }}
      SOAK_MINUTES: ${{ inputs.soak_minutes }}
      HIL_ARTIFACT_DIR: ${{ github.workspace }}/hil-artifacts
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run thermal characterization
        run: ci/thermal-soak.sh

      - name: Publish characterization summary
        if: always()
        run: |
          summary_path=$(find hil-artifacts -mindepth 2 -maxdepth 2 -type f -name summary.md -print -quit 2>/dev/null || true)
          if [ -n "$summary_path" ]; then
            cat "$summary_path" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Thermal SIMD HIL characterization" >> "$GITHUB_STEP_SUMMARY"
            echo "Characterization did not produce a summary; inspect the uploaded logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload HIL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thermal-simd-hil-${{ inputs.target_isa }}-${{ github.sha }}
          path: hil-artifacts/
          if-no-files-found: warn
          retention-days: 90
