apiVersion: v1
kind: ServiceAccount
metadata:
  name: thermal-simd
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: thermal-simd-dispatcher
  labels:
    app: thermal-simd
spec:
  selector:
    matchLabels:
      app: thermal-simd
  template:
    metadata:
      labels:
        app: thermal-simd
    spec:
      serviceAccountName: thermal-simd
      initContainers:
        - name: sandbox
          image: registry.example.com/thermal-simd:latest
          args:
            - "--interval=50"
            - "--sandbox-only"
          env:
            - name: TSD_LOG_LEVEL
              value: info
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - PERFMON
                - SYS_ADMIN
            seccompProfile:
              type: RuntimeDefault
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      containers:
        - name: dispatcher
          image: registry.example.com/thermal-simd:latest
          args:
            - "--interval=50"
            - "--metrics-bind=0.0.0.0"
            - "--metrics-port=9464"
          env:
            - name: TSD_LOG_LEVEL
              value: info
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - PERFMON
                - SYS_ADMIN
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          # Liveness intentionally checks only that the embedded HTTP server is
          # responsive. /readyz carries perf/telemetry/controller dependency
          # health, allowing recoverable perf loss to hot-reprobe in place
          # instead of being killed by the kubelet.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: cpu-msr
              mountPath: /dev/cpu
              readOnly: true
            - name: perf-events
              mountPath: /sys/bus/event_source
              readOnly: true
      volumes:
        - name: cpu-msr
          hostPath:
            path: /dev/cpu
            type: Directory
        - name: perf-events
          hostPath:
            path: /sys/bus/event_source
            type: Directory
