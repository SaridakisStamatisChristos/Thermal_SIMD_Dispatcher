apiVersion: v1
kind: ServiceAccount
metadata:
  name: thermal-simd
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: thermal-simd-dispatcher
  labels:
    app: thermal-simd
spec:
  selector:
    matchLabels:
      app: thermal-simd
  template:
    metadata:
      labels:
        app: thermal-simd
    spec:
      serviceAccountName: thermal-simd
      initContainers:
        - name: sandbox
          image: registry.example.com/thermal-simd:latest
          args:
            - "--interval=50"
            - "--sandbox-only"
          env:
            - name: TSD_LOG_LEVEL
              value: info
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - PERFMON
            seccompProfile:
              type: RuntimeDefault
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      containers:
        - name: dispatcher
          image: registry.example.com/thermal-simd:latest
          args:
            - "--interval=50"
            - "--metrics-bind=0.0.0.0"
            - "--metrics-port=9464"
          env:
            - name: TSD_LOG_LEVEL
              value: info
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - PERFMON
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          # /healthz is process/exporter liveness only. Runtime dependencies
          # such as perf and thermal telemetry are intentionally represented by
          # /readyz so bounded hot-recovery can complete without kubelet churn.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: perf-events
              mountPath: /sys/bus/event_source
              readOnly: true
      volumes:
        - name: perf-events
          hostPath:
            path: /sys/bus/event_source
            type: Directory

# This default manifest intentionally does not mount /dev/cpu or grant
# CAP_SYS_RAWIO. The runtime can use cpufreq/sysfs telemetry without MSRs.
# Deployments that explicitly require APERF/MPERF MSR reads should add only the
# required /dev/cpu device access and host-specific permission/CAP_SYS_RAWIO
# policy rather than broadening every deployment with CAP_SYS_ADMIN.
