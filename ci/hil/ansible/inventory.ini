[hil_runners]
# Example inventory for AVX-512 capable hardware-in-the-loop runners
avx512-runner-01 ansible_host=192.0.2.10 ansible_user=hil-admin
avx512-runner-02 ansible_host=192.0.2.11 ansible_user=hil-admin

[hil_runners:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
runner_user=gitlab-runner
runner_service=gitlab-runner
perf_capability_path=/usr/bin/perf
thermal_dispatcher_path=/opt/thermal_simd_dispatcher/bin/thermal_simd
