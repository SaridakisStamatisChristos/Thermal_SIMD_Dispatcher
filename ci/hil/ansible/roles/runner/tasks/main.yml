---
- name: Ensure required packages are installed
  package:
    name:
      - git
      - build-essential
      - cmake
      - curl
      - ninja-build
      - libssl-dev
      - linux-tools-common
      - linux-tools-generic
      - hwloc
      - numactl
    state: present

- name: Verify AVX-512 feature availability
  command: lscpu
  register: lscpu_output
  changed_when: false

- name: Abort when AVX-512 is not exposed by the CPU
  fail:
    msg: >-
      Host {{ inventory_hostname }} does not expose AVX-512 (avx512f missing from lscpu flags).
      Verify the instance type or bare-metal SKU.
  when: "'avx512f' not in lscpu_output.stdout"

- name: Create runner service drop-in directory
  file:
    path: "/etc/systemd/system/{{ runner_service }}.service.d"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure ambient capabilities for runner service
  template:
    src: runner-capabilities.conf.j2
    dest: "/etc/systemd/system/{{ runner_service }}.service.d/capabilities.conf"
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart runner service

- name: Create runner facts directory
  file:
    path: /etc/thermal-simd
    state: directory
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: '0750'

- name: Persist AVX-512 validation status
  copy:
    dest: /etc/thermal-simd/avx512.status
    content: |
      status=ok
      detected_flags={{ lscpu_output.stdout_lines | select('match', 'Flags:') | list | first | default('unknown') }}
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: '0640'
